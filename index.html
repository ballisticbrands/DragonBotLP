    <!-- Webfonts. preconnect opens the TLS handshake early; the stylesheet
         used to be an @import inside globals.css, which serialised
         css → font-css → font and cost ~814ms of render-blocking time on
         mobile, delaying the LCP <h1>. As a <link> it races with our own CSS. -->
